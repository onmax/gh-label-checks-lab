name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
concurrency:
  group: ci-${{ github.ref }}${{ github.event.action == 'labeled' && !startsWith(github.event.label.name, 'engine:') && format('-noop-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Real checks
        if: github.event.action != 'labeled' || startsWith(github.event.label.name, 'engine:')
        run: exit 1
      - run: echo "done"
