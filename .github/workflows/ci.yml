name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Event payload labels
        run: echo '${{ toJSON(github.event.pull_request.labels.*.name) }}'
      - name: Live labels via API
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }} --jq '[.labels[].name]'
